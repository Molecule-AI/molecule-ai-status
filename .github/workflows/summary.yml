name: Summary CI
on:
  repository_dispatch:
    types: [summary]
  schedule:
    # Daily summary of past-day uptime posted to the README badges.
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  release:
    name: Generate README + summary
    runs-on: ubuntu-latest
    steps:
      - uses: upptime/uptime-monitor@master
        with:
          command: "readme"
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  issues: write
